name: Health Fix - Compile HealthKit Probe (macOS)
on:
  push:
    branches:
      - 'sandbox/health-fix-healthkit-probe'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Generate HealthKit test project and compile on Mac
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p HealthFixHealthKitProbe out
          cat > project.yml <<'PROJ'
          name: HealthFixHealthKitProbe
          options:
            bundleIdPrefix: com.healthfix
            deploymentTarget:
              iOS: "17.0"
          targets:
            HealthFixHealthKitProbe:
              type: application
              platform: iOS
              sources:
                - HealthFixHealthKitProbe
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.healthfix.healthkitprobe
                  CODE_SIGN_ENTITLEMENTS: HealthFixHealthKitProbe/HealthFixHealthKitProbe.entitlements
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_NSHealthShareUsageDescription: "Lee únicamente el peso corporal para comprobar acceso a HealthKit."
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1"
          PROJ
          cat > HealthFixHealthKitProbe/HealthFixHealthKitProbeApp.swift <<'APP'
          import SwiftUI
          
          @main
          struct HealthFixHealthKitProbeApp: App {
              var body: some Scene {
                  WindowGroup { ContentView() }
              }
          }
          APP
          cat > HealthFixHealthKitProbe/ContentView.swift <<'VIEW'
          import SwiftUI
          
          struct ContentView: View {
              @StateObject private var health = HealthReader()
              var body: some View {
                  NavigationStack {
                      VStack(spacing: 24) {
                          Text("Health Fix — HealthKit Probe")
                              .font(.title2.bold())
                          Text("Prueba local de lectura de peso corporal. No envía datos a Internet.")
                              .font(.callout)
                          Button("1. Solicitar permiso de Salud") {
                              Task { await health.requestAccess() }
                          }
                          .buttonStyle(.borderedProminent)
                          Button("2. Leer último peso") {
                              health.fetch()
                          }
                          .buttonStyle(.bordered)
                          Text(health.status)
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .padding()
                          Spacer()
                      }
                      .padding()
                  }
              }
          }
          VIEW
          cat > HealthFixHealthKitProbe/HealthReader.swift <<'HEALTH'
          import Foundation
          import Combine
          import HealthKit
          
          @MainActor
          final class HealthReader: ObservableObject {
              @Published var status = "Aún no se ha solicitado el acceso."
              private let store = HKHealthStore()
              private let weightType = HKObjectType.quantityType(forIdentifier: .bodyMass)!
          
              func requestAccess() async {
                  guard HKHealthStore.isHealthDataAvailable() else {
                      status = "HealthKit no disponible en este dispositivo."
                      return
                  }
                  do {
                      try await store.requestAuthorization(toShare: [], read: [weightType])
                      status = "Solicitud completada. Apple no revela si la lectura fue permitida."
                  } catch {
                      status = "Error de autorización: \(error.localizedDescription)"
                  }
              }
          
              func fetch() {
                  let sort = NSSortDescriptor(key: HKSampleSortIdentifierEndDate, ascending: false)
                  let query = HKSampleQuery(sampleType: weightType,
                                            predicate: nil,
                                            limit: 1,
                                            sortDescriptors: [sort]) { [weak self] _, samples, error in
                      Task { @MainActor [weak self] in
                          guard let self else { return }
                          if let sample = samples?.first as? HKQuantitySample {
                              let kg = sample.quantity.doubleValue(for: .gramUnit(with: .kilo))
                              self.status = String(format: "HealthKit OK: %.2f kg. Fecha: %@", kg, sample.endDate.description)
                          } else {
                              self.status = "Sin muestra visible o permiso denegado. \(error?.localizedDescription ?? "")"
                          }
                      }
                  }
                  store.execute(query)
              }
          }
          HEALTH
          cat > HealthFixHealthKitProbe/HealthFixHealthKitProbe.entitlements <<'ENT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.healthkit</key>
            <true/>
          </dict>
          </plist>
          ENT
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
          xcodebuild -version
          set -o pipefail
          xcodebuild -project HealthFixHealthKitProbe.xcodeproj -scheme HealthFixHealthKitProbe -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/HealthFixHealthKitProbe.app out/Payload/
          (cd out && zip -q -r HealthFixHealthKitProbe-UNSIGNED.ipa Payload)
          rm -rf out/Payload
          unzip -t out/HealthFixHealthKitProbe-UNSIGNED.ipa | tail -2
      - name: Upload build report and unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthfix-healthkit-macos-build
          path: |
            build.log
            out/HealthFixHealthKitProbe-UNSIGNED.ipa
          if-no-files-found: warn
          retention-days: 7
